on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '24.15.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Clone source files
      uses: actions/checkout@v6

    - name: Clone destination files
      uses: actions/checkout@v6
      with:
        repository: hazevape/HazeVapeCompiled
        token: ${{ secrets.ACTIONS_GITHUB_TOKEN }}
        path: "./HazeVapeCompiled"

    - name: Clone bundler
      uses: actions/checkout@v6
      with:
        repository: hazevape/HazeVapeBundler
        path: "./HazeVapeBundler"

    - name: Copy bundler configuration
      run: |-
        mv ./.github/workflows/workflowConfig.json ./HazeVapeBundler/config.json

    - name: Install node packages
      run: |-
        cd ./HazeVapeBundler
        npm i

    - name: Set up Node.js
      uses: actions/setup-node@v6

    - name: Run Bundler
      run: |-
        node ./HazeVapeBundler/index.js prod

    - name: Setup git commit
      run: |-
        git config --global user.name "github-actions[bot]"
        git config --global user.email "username@users.noreply.github.com"

    - name: Push commit
      run: |-
        cd ./HazeVapeCompiled
        git add .
        git commit -m "Updated Vape"
        git push origin
